<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Sản phẩm</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Nếu tách CSS ra file riêng -->
    <style>
      /* Inline CSS cho đơn giản */
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .search-filter {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      input,
      select {
        padding: 8px;
      }
      .products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
      }
      .product-box {
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
      }
      .product-box img {
        max-width: 100%;
        height: 150px;
        object-fit: cover;
      }
      .product-box h3 {
        margin: 10px 0;
      }
      .product-box p {
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <h1>Quản lý Sản phẩm</h1>

    <div class="search-filter">
      <input type="text" id="search" placeholder="Tìm kiếm sản phẩm..." />
      <select id="category-filter">
        <option value="">Tất cả danh mục</option>
        <option value="Điện tử">Điện tử</option>
        <option value="Thời trang">Thời trang</option>
        <option value="Gia dụng">Gia dụng</option>
      </select>
      <input type="range" id="price-filter" min="0" max="1000" value="1000" />
      <span id="price-value">Giá tối đa: 1000 VND</span>
    </div>

    <div class="products" id="products-container">
      <!-- Sản phẩm sẽ được render bởi JS -->
    </div>

    <script src="script.js"></script>
    <!-- Nếu tách JS ra file riêng -->
    <script>
      // Inline JS cho đơn giản
      const products = [
        {
          id: 1,
          name: "Điện thoại Samsung",
          price: 500,
          category: "Điện tử",
          image: "https://via.placeholder.com/250x150?text=Samsung",
        },
        {
          id: 2,
          name: "Áo thun Nike",
          price: 200,
          category: "Thời trang",
          image: "https://via.placeholder.com/250x150?text=Nike",
        },
        {
          id: 3,
          name: "Máy lọc không khí",
          price: 300,
          category: "Gia dụng",
          image: "https://via.placeholder.com/250x150?text=Air+Purifier",
        },
        {
          id: 4,
          name: "Laptop Dell",
          price: 800,
          category: "Điện tử",
          image: "https://via.placeholder.com/250x150?text=Dell",
        },
        {
          id: 5,
          name: "Giày Adidas",
          price: 150,
          category: "Thời trang",
          image: "https://via.placeholder.com/250x150?text=Adidas",
        },
        {
          id: 6,
          name: "Nồi cơm điện",
          price: 100,
          category: "Gia dụng",
          image: "https://via.placeholder.com/250x150?text=Rice+Cooker",
        },
      ];

      const searchInput = document.getElementById("search");
      const categoryFilter = document.getElementById("category-filter");
      const priceFilter = document.getElementById("price-filter");
      const priceValue = document.getElementById("price-value");
      const productsContainer = document.getElementById("products-container");

      function renderProducts(filteredProducts) {
        productsContainer.innerHTML = "";
        filteredProducts.forEach((product) => {
          const box = document.createElement("div");
          box.className = "product-box";
          box.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p>Giá: ${product.price} VND</p>
                    <p>Danh mục: ${product.category}</p>
                `;
          productsContainer.appendChild(box);
        });
      }

      function filterProducts() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedCategory = categoryFilter.value;
        const maxPrice = parseInt(priceFilter.value);

        const filtered = products.filter((product) => {
          const matchesSearch = product.name.toLowerCase().includes(searchTerm);
          const matchesCategory =
            !selectedCategory || product.category === selectedCategory;
          const matchesPrice = product.price <= maxPrice;
          return matchesSearch && matchesCategory && matchesPrice;
        });

        renderProducts(filtered);
      }

      // Sự kiện
      searchInput.addEventListener("input", filterProducts);
      categoryFilter.addEventListener("change", filterProducts);
      priceFilter.addEventListener("input", () => {
        priceValue.textContent = `Giá tối đa: ${priceFilter.value} VND`;
        filterProducts();
      });

      // Khởi tạo
      renderProducts(products);
    </script>
  </body>
</html>
